# Fly.io app config. Replace `app` and `primary_region` for your deployment.
# See README for `flyctl secrets set` commands (MASTER_SECRET, WEBHOOK_SECRET,
# DATABASE_URL, BREEZ_API_KEY, PUBLIC_BASE_URL).

app = "sdk-mu-demo"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NETWORK = "mainnet"
  LOG_FORMAT = "json"
  SDK_LOG_FILTER = "debug"
  # PUBLIC_BASE_URL, CORS_ORIGINS, etc. should be set via `flyctl secrets set`.

[http_service]
  internal_port = 8080
  force_https = true
  # Always-on. Webhooks need a reachable handler, and the JVM hosts background
  # tasks (reconciliation sync, leaf optimization) that must run continuously.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/readyz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
